<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Platina: Information Jukebox</title>
  <style>
    /* Earthy olive & cream jukebox theme */
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #637545;
      color: #EBEBD8;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .page-header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 1px;
      color: #EBEBD8;
    }

    .subtitle {
      margin: 5px 0 20px;
      font-weight: 400;
      color: #EBEBD8;
      font-size: 1.2rem;
    }

    .instructions {
      color: #EBEBD8;
      margin-bottom: 30px;
    }

    /* Slideshow Card Styling */
    .slideshow-wrapper {
      background: #455230;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
      max-width: 600px;
      width: 100%;
    }

    .slideshow-label {
      margin: 0 0 12px;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #9BA685;
    }

    .slideshow-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    .mySlides1 {
      display: none;
    }

    /* Static Display Image */
    .slide-image {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }

    /* Clickable Pill Button Floating at Bottom of Image */
    .playButn {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(69, 82, 48, 0.92);
      color: #EBEBD8;
      border: 1.5px solid #9BA685;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
    }

    .playButn:hover {
      transform: translateX(-50%) scale(1.05);
      background: #EBEBD8;
      color: #455230;
      border-color: #EBEBD8;
    }

    .playButn:active {
      transform: translateX(-50%) scale(0.98);
    }

    /* Next & Previous Arrows */
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #EBEBD8;
      background-color: rgba(69, 82, 48, 0.75);
      font-weight: bold;
      font-size: 18px;
      border-radius: 50%;
      user-select: none;
      transition: background-color 0.2s, color 0.2s;
    }

    .prev { left: 12px; }
    .next { right: 12px; }

    .prev:hover, .next:hover {
      background-color: #EBEBD8;
      color: #455230;
    }

  </style>
   
</head>
<body>

  <header class="page-header">
    <h1>Crew Platina</h1>
    <h2 class="subtitle">Earth Information Jukebox</h2>
  </header>

  <p class="instructions">Use the arrows to browse, then click the button to <b>listen</b> to the patterns</p>

  <div class="slideshow-wrapper">
    <p class="slideshow-label">Channel 01</p>
    
    <div class="slideshow-container">
      <div class="mySlides1">
        <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 1">
        <button class="playButn" type="button" onclick="alert('Button #1 clicked!')">
          &#9654; Play Pattern 1
        </button>
      </div>

      <div class="mySlides1">
        <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 2">
        <button class="playButn" type="button" onclick="alert('Button #2 clicked!')">
          &#9654; Play Pattern 2
        </button>
      </div>

      <div class="mySlides1">
        <img class="slide-image" src="https://static.vecteezy.com/system/resources/thumbnails/083/933/835/small/beautiful-and-inspiring-picture-detailing-a-bright-hot-air-balloon-over-river-pure-cozy-perfect-for-creatives-moods-stock-image-free-photo.jpeg" alt="Pattern 3">
        <button class="playButn" type="button" onclick="alert('Button #3 clicked!')">
          &#9654; Play Pattern 3
        </button>
      </div>

      <a class="prev" onclick="plusSlides(-1, 0)">&#10094;</a>
      <a class="next" onclick="plusSlides(1, 0)">&#10095;</a>
    </div>
  </div>

  <script>
    let slideIndex = [1];
    let slideId = ["mySlides1"];
    showSlides(1, 0);

    function plusSlides(n, no) {
      showSlides(slideIndex[no] += n, no);
    }

    function showSlides(n, no) {
      let i;
      let x = document.getElementsByClassName(slideId[no]);
      if (!x.length) return;
      if (n > x.length) { slideIndex[no] = 1; }    
      if (n < 1) { slideIndex[no] = x.length; }
      for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";  
      }
      x[slideIndex[no] - 1].style.display = "block";  
    }
  </script>
</body>
</html>
