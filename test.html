<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PNG RGB Sonifier (Debugged)</title>
  <script src="https://cdn.jsdelivr.net/npm/tone"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; }
    canvas { border: 2px solid #000; display: block; margin: 15px 0; width: 100%; height: 120px; image-rendering: pixelated; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #1a73e8; color: #fff; border: none; border-radius: 4px; }
    #log { background: #f4f4f4; padding: 10px; border-left: 4px solid #cc0000; margin-top: 15px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head> 
<body>

  <h2>PNG RGB to Tone.js</h2>
  <input type="file" id="imageLoader" accept="image/png" />
  <button id="playBtn">Play Sound</button>
  <canvas id="imageCanvas"></canvas>
  <div id="log">Status: Waiting...</div>

  <script>
    const logBox = document.getElementById('log');
    function log(msg) {
      logBox.textContent = msg;
      console.log(msg);
    }

    // Catch any hidden errors and print them to the page
    window.onerror = function(message, source, lineno) {
      log(`ERROR on line ${lineno}: ${message}`);
    };

    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const imageLoader = document.getElementById('imageLoader');
    const playBtn = document.getElementById('playBtn');

    let columnNotes = [];
    const scale = ['C3', 'D3', 'E3', 'G3', 'A3', 'C4', 'D4', 'E4', 'G4', 'A4', 'C5'];

    // 1. Draw a test rainbow so you can test immediately
    function initTestPattern() {
      canvas.width = 24;
      canvas.height = 10;
      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0, 'red');
      grad.addColorStop(0.5, 'lime');
      grad.addColorStop(1, 'blue');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      extractColumnData();
      log(`Ready! Extracted ${columnNotes.length} columns from test image. Click "Play Sound".`);
    }

    // 2. Load uploaded PNG
    imageLoader.addEventListener('change', function(e) {
      const file = e.target.files.item(0);
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const maxCols = 48;
          const ratio = img.width > maxCols ? maxCols / img.width : 1;
          canvas.width = Math.max(1, Math.floor(img.width * ratio));
          canvas.height = Math.max(1, Math.floor(img.height * ratio));

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          extractColumnData();
          log(`Loaded "${file.name}" (${canvas.width} columns). Click "Play Sound".`);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 3. Extract RGB per column using standard array indexing
    function extractColumnData() {
      const w = canvas.width;
      const h = canvas.height;
      const data = ctx.getImageData(0, 0, w, h).data;
      columnNotes = [];

      for (let x = 0; x < w; x++) {
        let r = 0, g = 0, b = 0;
        for (let y = 0; y < h; y++) {
          const i = (y * w + x) * 4;
          r += data.slice(i, i + 1).reduce((a, v) => a + v, 0);
          g += data.slice(i + 1, i + 2).reduce((a, v) => a + v, 0);
          b += data.slice(i + 2, i + 3).reduce((a, v) => a + v, 0);
        }
        const rAvg = r / h;
        const gAvg = g / h;
        const bAvg = b / h;

        const noteIdx = Math.min(scale.length - 1, Math.floor((rAvg / 256) * scale.length));
        const note = scale.slice(noteIdx, noteIdx + 1).join('');
        const velocity = Math.max(0.5, gAvg / 255);
        const duration = bAvg > 150 ? '4n' : '8n';

        columnNotes.push({ note, velocity, duration });
      }
    }

    // 4. Play audio on click
    playBtn.addEventListener('click', async function() {
      if (typeof Tone === 'undefined') {
        log('ERROR: Tone.js failed to load from the internet. Check your connection or firewall.');
        return;
      }

      try {
        await Tone.start();
        const synth = new Tone.Synth().toDestination();
        const now = Tone.now();
        const step = 0.15;

        log(`Playing ${columnNotes.length} notes...`);

        columnNotes.forEach((item, idx) => {
          synth.triggerAttackRelease(item.note, item.duration, now + idx * step, item.velocity);
        });
      } catch (err) {
        log('Audio Error: ' + err.message);
      }
    });

    initTestPattern();
  </script>
</body>
</html>
