<!DOCTYPE html>
<html>
<head>
<script src="https://unpkg.com/tone"></script>
</head>
<body>
<input type="file" id="imageInput" accept="image/png">
<button id="playBtn">Play Image</button>
<canvas id="canvas"></canvas>
 
<script>
const input = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
 
let extractedPixels = [];
 
input.addEventListener("change", (event) => {
const file = event.target.files[0];
if (!file) return;
 
const img = new Image();
 
img.onload = () => {
canvas.width = img.width;
canvas.height = img.height;
ctx.drawImage(img, 0, 0);
 
const imageData = ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);
 
const pixels = imageData.data;
extractedPixels = [];
 
for (let y = 0; y < canvas.height; y++) {
for (let x = 0; x < canvas.width; x++) {
 
const i = (y * canvas.width + x) * 4;
 
const r = pixels[i];
const g = pixels[i + 1];
const b = pixels[i + 2];
const a = pixels[i + 3];
 
const brightness =
r * 0.299 +
g * 0.587 +
b * 0.114;
 
extractedPixels.push({
x, y, r, g, b, a, brightness
});
}
}
 
console.log(extractedPixels);
};
 
img.src = URL.createObjectURL(file);
});
 
const synth = new Tone.Synth().toDestination();
 
document.getElementById("playBtn").addEventListener("click", async () => {
 
await Tone.start();
 
// Sample every 100th pixel to avoid thousands of notes
const data = extractedPixels.filter((_, i) => i % 100 === 0);
 
let time = Tone.now();
 
data.forEach(pixel => {
 
// Brightness (0-255) -> Frequency (100-1000 Hz)
const freq =
100 + (pixel.brightness / 255) * 900;
 
// Red channel -> Velocity
const velocity =
pixel.r / 255;


synth.triggerAttackRelease(
freq,
"16n",
time
);
 
time += 0.1;
});
});
</script>
</body>
</html>
