<script>

// IMAGE ELEMENTS

const input = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const output = document.getElementById("output");

let result = [];


// CONFIGURATION

const config = {
    minFrequency: 150,
    maxFrequency: 1200,

    maxVolume: 0.8,

    noteDuration: 0.12,

    release: 0.08,

    sampleStep: 4
};


// TONE.JS INSTRUMENTS

let synth;
let playing = false;


// IMAGE PROCESSING

input.addEventListener("change", (event) => {

    const file = event.target.files[0];

    if (!file) return;

    const img = new Image();

    img.onload = () => {

        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(
            0, 0,
            canvas.width,
            canvas.height
        );

        const pixels = imageData.data;

        result = [];

        for (
            let y = 0;
            y < canvas.height;
            y += config.sampleStep
        ) {

            for (
                let x = 0;
                x < canvas.width;
                x += config.sampleStep
            ) {

                const i = (y * canvas.width + x) * 4;

                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const a = pixels[i + 3];

                const brightness =
                    r * 0.299 +
                    g * 0.587 +
                    b * 0.114;

                result.push({
                    x, y, r, g, b, a, brightness
                });

            }
        }

        output.textContent =
            JSON.stringify(result.slice(0, 100), null, 2);

        console.log(result);

        URL.revokeObjectURL(img.src);
    };

    img.src = URL.createObjectURL(file);

});

function stopMusic() {

    if (synth) {
        synth.releaseAll();
        synth.dispose();
