<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="https://unpkg.com/tone"></script>

    <title>YOOOOO SUCK IT GREEN BOY</title>
    <header>green bois suck</header>
</head>

<body>
    <h1>no me gusta green boys</h1>
    <img src="co2 _brightnes_jpeg.jpg" alt="co2_brightnes_jpeg" width="400" height="400">
    
    <button id="playBtn">Play Image</button>
    <canvas id="canvas"></canvas>
    
    <script>

        const upload = document.getElementById('upload');
        const playBtn = document.getElementById('playBtn');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
    
        let columnData = [];

        
    // Musical scale to map RGB values onto (C Major Pentatonic across 2 octaves)
    const scale = ['C3', 'D3', 'E3', 'G3', 'A3', 'C4', 'D4', 'E4', 'G4', 'A4', 'C5'];

        // 1. Load the PNG onto the Canvas
        imageLoader.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
            // Resize width if image is huge so the song doesn't last 10 minutes
            const maxCols = 64; 
            const scaleFactor = img.width > maxCols ? maxCols / img.width : 1;
            
            canvas.width = Math.floor(img.width * scaleFactor);
            canvas.height = Math.floor(img.height * scaleFactor);

            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            extractColumnData();
            playBtn.disabled = false;
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
        });

        // 2. Extract Average RGB for Each Column & Translate to Notes
        function extractColumnData() {
        const width = canvas.width;
        const height = canvas.height;
        // Get all pixel data in one 1D array: [R, G, B, A, R, G, B, A, ...]
        const imgData = ctx.getImageData(0, 0, width, height).data;
        
        columnNotes = [];

        for (let x = 0; x < width; x++) {
            let rTotal = 0, gTotal = 0, bTotal = 0;

            for (let y = 0; y < height; y++) {
            // Calculate the 1D array index for pixel (x, y)
            const index = (y * width + x) * 4;
            rTotal += imgData[index];     // Red (0-255)
            gTotal += imgData[index + 1]; // Green (0-255)
            bTotal += imgData[index + 2]; // Blue (0-255)
            }

            const rAvg = rTotal / height;
            const gAvg = gTotal / height;
            const bAvg = bTotal / height;

            // Translate RGB into musical parameters:
            // - Red controls Pitch (mapped to our scale)
            const noteIndex = Math.floor((rAvg / 256) * scale.length);
            const note = scale[noteIndex];

            // - Green controls Velocity / Volume (0.1 to 1.0)
            const velocity = Math.max(0.4, gAvg / 255);

            // - Blue controls Note Duration ('16n' to '4n')
            const duration = bAvg > 170 ? '4n' : bAvg > 85 ? '8n' : '16n';

            columnNotes.push({ note, velocity, duration });
        }
        console.log('Extracted Notes:', columnNotes);
        }

        // 3. Connect to the JS Button & Play with Tone.js
        playBtn.addEventListener('click', async () => {
        // Browsers require user interaction to start the Web Audio context
        await Tone.start();

        // Create a polyphonic synth so overlapping notes don't cut each other off
        const synth = new Tone.PolySynth(Tone.Synth).toDestination();
        const now = Tone.now();
        const stepTime = 0.15; // Seconds between each column

        columnNotes.forEach((data, colIndex) => {
            const triggerTime = now + (colIndex * stepTime);
            synth.triggerAttackRelease(data.note, data.duration, triggerTime, data.velocity);
        });
        });
    </script>
</body>
</html>
