<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Full-Resolution RGB Image Sonifier</title>
    <script src="https://cdn.jsdelivr.net/npm/tone"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background: #121212;
        color: #eee;
      }
      button,
      input {
        padding: 10px;
        font-size: 16px;
        margin-right: 10px;
        cursor: pointer;
      }

      .canvas-wrapper {
        position: relative;
        display: inline-block;
        margin-top: 15px;
        border: 1px solid #444;
        line-height: 0;
        max-width: 100%;
      }
      canvas {
        display: block;
        max-width: 100%; /* Scales down visually only if wider than screen */
        height: auto;
      }
      #overlayCanvas {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h2>Full-Resolution Polyphonic RGB Sonifier</h2>
    <input type="file" id="imageInput" accept="image/png" />
    <button id="playBtn" disabled>Play Image</button>
    <button id="stopBtn" disabled>Stop</button>

    <div class="canvas-wrapper" id="canvasWrapper" style="display: none">
      <canvas id="imageCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <script>
      const imageInput = document.getElementById('imageInput');
      const playBtn = document.getElementById('playBtn');
      const stopBtn = document.getElementById('stopBtn');
      const canvasWrapper = document.getElementById('canvasWrapper');
      const imageCanvas = document.getElementById('imageCanvas');
      const overlayCanvas = document.getElementById('overlayCanvas');
      const imgCtx = imageCanvas.getContext('2d');
      const overlayCtx = overlayCanvas.getContext('2d');

      let columnData = [];
      let isPlaying = false;
      let scanTimer = null;
      let animFrameId = null;
      let playbackStartTime = 0;

      const stepTime = 0.12; // 120ms per slice
      const brightnessThreshold = 0.65;
      const targetSlices = 150; // Keeps playback smooth regardless of image width

      // 1. Load PNG at full native resolution
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const img = new Image();
        img.onload = () => {
          // Keep exact original width and height
          imageCanvas.width = img.width;
          imageCanvas.height = img.height;
          overlayCanvas.width = img.width;
          overlayCanvas.height = img.height;

          canvasWrapper.style.display = 'inline-block';
          imgCtx.drawImage(img, 0, 0);
          overlayCtx.clearRect(0, 0, img.width, img.height);

          extractColumnBands();
          playBtn.disabled = false;
        };
        img.src = URL.createObjectURL(file);
      });

      // 2. Group full-resolution columns into smooth vertical slices
      function extractColumnBands() {
        const { width, height } = imageCanvas;
        const imgData = imgCtx.getImageData(0, 0, width, height).data;
        columnData = [];

        const numSlices = Math.min(width, targetSlices);
        const sliceWidth = width / numSlices;
        const bandHeight = Math.floor(height / 3) || 1;

        for (let s = 0; s < numSlices; s++) {
          const startX = Math.floor(s * sliceWidth);
          const endX = Math.max(startX + 1, Math.floor((s + 1) * sliceWidth));

          let topR = 0, midG = 0, botB = 0, totalLum = 0;
          let topCount = 0, midCount = 0, botCount = 0, totalPixels = 0;

          for (let x = startX; x < endX; x++) {
            for (let y = 0; y < height; y++) {
              const i = (y * width + x) * 4;
              const r = imgData[i];
              const g = imgData[i + 1];
              const b = imgData[i + 2];

              totalLum += (r + g + b) / 3;
              totalPixels++;

              if (y < bandHeight) {
                topR += r;
                topCount++;
              } else if (y < bandHeight * 2) {
                midG += g;
                midCount++;
              } else {
                botB += b;
                botCount++;
              }
            }
          }

          columnData.push({
            top: (topR / (topCount || 1)) / 255,
            mid: (midG / (midCount || 1)) / 255,
            bot: (botB / (botCount || 1)) / 255,
            lum: (totalLum / (totalPixels || 1)) / 255
          });
        }
      }

      // 3. Shared Master Effects & Dynamic Master Volume
      const masterGain = new Tone.Volume(-2).toDestination();
      const reverb = new Tone.Reverb({ decay: 5, wet: 0.5 }).connect(masterGain);
      const masterFilter = new Tone.Filter({ type: "lowpass", frequency: 1400, rolloff: -12 }).connect(reverb);

      // 4. Held Background Drone Synth (Constant Root Note C2)
      const droneFilter = new Tone.Filter({ type: "lowpass", frequency: 250 }).connect(reverb);
      const droneSynth = new Tone.Synth({
        oscillator: { type: "triangle" },
        envelope: { attack: 1.5, decay: 0.5, sustain: 1, release: 2.5 }
      }).connect(droneFilter);
      droneSynth.volume.value = -12;

      // 5. Three Core Melodic Voices + One High Shimmer Voice
      function createMelodicVoice(panValue, volumeDb) {
        const panner = new Tone.Panner(panValue).connect(masterFilter);
        const voice = new Tone.FMSynth({
          harmonicity: 1.5,
          modulationIndex: 1.5,
          oscillator: { type: "sine" },
          modulation: { type: "sine" },
          envelope: { attack: 1.0, decay: 0.5, sustain: 1, release: 2.0 }
        }).connect(panner);
        voice.volume.value = volumeDb;
        return voice;
      }

      const shimmerVoice = createMelodicVoice(0.0, -60);
      const highVoice    = createMelodicVoice(0.35, -14);
      const midVoice     = createMelodicVoice(0.0, -13);
      const lowVoice     = createMelodicVoice(-0.35, -14);

      // C Major Pentatonic across 4 octaves
      const shimmerScale = [1046.50, 1174.66, 1318.51, 1567.98, 1760.00, 2093.00];
      const highScale    = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
      const midScale     = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
      const lowScale     = [130.81, 146.83, 164.81, 196.00, 220.00, 261.63];

      function getNote(val, scale) {
        const idx = Math.min(scale.length - 1, Math.floor(val * scale.length));
        return scale[idx];
      }

      // 6. Full-Resolution Translucent Scan Bar Animation Loop
      function drawPlayhead() {
        if (!isPlaying) return;

        const elapsed = Tone.now() - playbackStartTime;
        const exactSlice = elapsed / stepTime;
        const { width, height } = overlayCanvas;

        overlayCtx.clearRect(0, 0, width, height);

        if (exactSlice < columnData.length) {
          const sliceIdx = Math.floor(exactSlice);
          const lum = columnData[sliceIdx] ? columnData[sliceIdx].lum : 0;
          const isBright = lum > brightnessThreshold;

          // Scale the bar's position and width to the full native resolution
          const slicePixelWidth = width / columnData.length;
          const barWidth = Math.max(4, slicePixelWidth * 1.5);
          const barCenterX = (exactSlice + 0.5) * slicePixelWidth;

          // Translucent highlight body
          overlayCtx.fillStyle = isBright
            ? 'rgba(255, 250, 200, 0.5)'
            : 'rgba(255, 255, 255, 0.32)';
          overlayCtx.fillRect(barCenterX - barWidth / 2, 0, barWidth, height);

          // Crisp center indicator line scaled to image resolution
          const lineWidth = Math.max(1, width * 0.002);
          overlayCtx.fillStyle = isBright
            ? 'rgba(255, 255, 255, 0.95)'
            : 'rgba(255, 255, 255, 0.75)';
          overlayCtx.fillRect(barCenterX - lineWidth / 2, 0, lineWidth, height);

          animFrameId = requestAnimationFrame(drawPlayhead);
        }
      }

      // 7. Audio Playback Loop
      playBtn.addEventListener('click', async () => {
        if (isPlaying || columnData.length === 0) return;
        await Tone.start();

        isPlaying = true;
        playBtn.disabled = true;
        stopBtn.disabled = false;

        let col = 0;
        playbackStartTime = Tone.now();

        droneSynth.triggerAttack("C2");

        const first = columnData[0];
        shimmerVoice.volume.value = -60;
        shimmerVoice.triggerAttack(getNote(first.lum, shimmerScale));
        highVoice.triggerAttack(getNote(first.top, highScale));
        midVoice.triggerAttack(getNote(first.mid, midScale));
        lowVoice.triggerAttack(getNote(first.bot, lowScale));

        animFrameId = requestAnimationFrame(drawPlayhead);

        scanTimer = setInterval(() => {
          if (col >= columnData.length || !isPlaying) {
            stopSonification();
            return;
          }

          const { top, mid, bot, lum } = columnData[col];

          highVoice.frequency.rampTo(getNote(top, highScale), stepTime);
          midVoice.frequency.rampTo(getNote(mid, midScale), stepTime);
          lowVoice.frequency.rampTo(getNote(bot, lowScale), stepTime);
          shimmerVoice.frequency.rampTo(getNote(lum, shimmerScale), stepTime);

          if (lum > brightnessThreshold) {
            const brightRatio = (lum - brightnessThreshold) / (1 - brightnessThreshold);
            const targetShimmerVol = -24 + (brightRatio * 13);
            shimmerVoice.volume.rampTo(targetShimmerVol, stepTime * 1.5);
            masterGain.volume.rampTo(-2 + (brightRatio * 5), stepTime * 1.5);
          } else {
            shimmerVoice.volume.rampTo(-60, stepTime * 2);
            masterGain.volume.rampTo(-2, stepTime * 2);
          }

          masterFilter.frequency.rampTo(400 + lum * 2400, stepTime);
          droneFilter.frequency.rampTo(150 + lum * 350, stepTime);
          droneSynth.volume.rampTo(-18 + lum * 8, stepTime);

          col++;
        }, stepTime * 1000);
      });

      function stopSonification() {
        isPlaying = false;
        clearInterval(scanTimer);
        cancelAnimationFrame(animFrameId);
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        droneSynth.triggerRelease();
        shimmerVoice.triggerRelease();
        highVoice.triggerRelease();
        midVoice.triggerRelease();
        lowVoice.triggerRelease();

    
    </script>
  </body>
</html>
